services:
  bridge:
    build: .
    # Or, once published: image: fastdiscordgotifybridge:latest
    image: fastdiscordgotifybridge:latest
    container_name: discord-gotify-bridge
    restart: unless-stopped
    environment:
      DISCORD_USER_TOKEN: "${DISCORD_USER_TOKEN}"
      GOTIFY_URL: "${GOTIFY_URL}"
      GOTIFY_TOKEN: "${GOTIFY_TOKEN}"
      GOTIFY_DEFAULT_PRIORITY: "5"
      # Watch list: entries separated by ';', each is "label|channels[|priority]"
      WATCH: "My Server #alerts|222222222222222222,333333333333333333|8; Other #general|444444444444444444"
      # Optional behaviour flags:
      # DISCORD_NOTIFY_OWN: "false"
      # DISCORD_IGNORE_BOTS: "false"

    # --- Alternative: mount a config.toml instead of using env vars ---
    # volumes:
    #   - ./config.toml:/config.toml:ro
